<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PVT Survey — เข้าสู่ระบบผู้ดูแลระบบ (Admin)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
  </head>
  <body>
    <main class="login-wrap">
      <section class="card login-card" style="box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);">
        <div class="brand">
          <div class="brand-mark" style="width:52px;height:52px;background:transparent;padding:0;display:grid;place-items:center;">
            <img src="icon-192.png" alt="Logo" style="width:46px;height:46px;object-fit:contain" referrerPolicy="no-referrer" />
          </div>
          <div>PVT&T GROUP<small>ระบบจัดการผู้ดูแลระบบและผู้บริหาร</small></div>
        </div>

        <div style="margin-bottom: 20px; text-align: center;">
          <div style="display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:#eff6ff;color:#1e40af;margin-bottom:10px;">
            <svg class="pvt-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </div>
          <h1 style="margin: 0 0 4px; font-size: 22px; color: #0f172a;">เข้าสู่ระบบ Admin</h1>
          <p class="small muted" style="margin: 0; font-size: 13px;">
            สำหรับผู้ดูแลระบบและผู้บริหาร (ใช้ Username & Password)
          </p>
        </div>

        <form id="login-form" class="stack">
          <div class="field">
            <label for="username">Username หรือ Email</label>
            <input
              id="username"
              class="input"
              autocomplete="username"
              required
              autofocus
              placeholder="เช่น admin หรือ management"
            />
          </div>
          <div class="field">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <label for="password">Password</label>
            </div>
            <div style="position:relative;">
              <input
                id="password"
                type="password"
                class="input"
                autocomplete="current-password"
                required
                placeholder="••••••••"
                style="padding-right: 42px;"
              />
              <button
                type="button"
                id="toggle-pwd-btn"
                style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;padding:6px;cursor:pointer;color:#64748b;display:flex;align-items:center;justify-content:center;"
                title="แสดง/ซ่อนรหัสผ่าน"
                aria-label="แสดง/ซ่อนรหัสผ่าน"
              >
                <svg id="eye-icon" class="pvt-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button
            class="btn btn-primary"
            type="submit"
            id="admin-submit-btn"
            style="
              background: #000c85;
              color: #fff;
              padding: 12px;
              font-size: 15px;
              display: inline-flex;
              align-items: center;
              justify-content: center;
              gap: 8px;
              margin-top: 6px;
              border-radius: 10px;
            "
          >
            <svg
              class="pvt-icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <span style="font-weight: 500;">เข้าสู่ระบบ Admin</span>
          </button>
        </form>

        <div style="margin-top: 22px; padding-top: 14px; border-top: 1px dashed #e2e8f0; text-align: center;">
          <a
            href="index.html"
            style="
              display: inline-flex;
              align-items: center;
              gap: 6px;
              font-size: 8px;
              color: #0284c7;
              text-decoration: none;
              padding: 8px 14px;
              border-radius: 20px;
              background: #f0f9ff;
              border: 1px solid #bae6fd;
              transition: all 0.2s ease;
              font-weight: 500;
            "
          >
            <svg class="pvt-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <span>สำหรับฝ่ายขาย คลิกที่นี่ (Sales Login) &rarr;</span>
          </a>
        </div>

        <div class="divider" style="margin-top: 20px;"></div>
        <div
          class="small muted"
          style="
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 11.5px;
          "
        >
          <svg
            class="pvt-icon"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7" />
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" />
            <path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4" />
            <path d="M2 7h20" />
          </svg>
          <span>PVTTPLASGROUP</span>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
